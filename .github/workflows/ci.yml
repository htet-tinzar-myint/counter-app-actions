# CI：プルリクエストのたびに実行
#   1. 2つのサービスのイメージをビルド
#   2. docker compose で起動
#   3. スモークテスト（dashboard → counting の通信まで確認）
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に新しい push があったら、古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Smoke test
        run: |
          pip install websocket-client
          python scripts/smoke_test.py http://localhost:8080

      # ランナーの画面はブラウザで見られないので、スクリーンショットを Artifact に保存する
      - name: Screenshot dashboard
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/screenshot.py http://localhost:8080 dashboard.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshot
          path: dashboard.png

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
